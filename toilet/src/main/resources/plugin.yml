name: ToiletPlugin
version: ${version}
main: com.example.toiletplugin.ToiletPlugin
api-version: "1.20"
description: Adds functional toilet blocks to your server.
author: YourName

commands:
  placetoilet:
    description: Gives you a custom toilet item to place.
    usage: /placetoilet
    permission: toiletplugin.place
  placetoiletex:
    description: Gives you an experimental toilet item for placeholder-block testing.
    usage: /placetoiletex
    permission: toiletplugin.place

permissions:
  toiletplugin.place:
    description: Allows the player to place toilet blocks.
    default: true
