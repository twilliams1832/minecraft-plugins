plugins {
    id 'java'
}

group = 'com.example'
version = '1.1.0'
description = 'ToiletPlugin - Functional toilet blocks for PaperMC 1.20+'

// Java 17 required for modern Paper API
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    // PaperMC Maven repository
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Paper API is provided by the server at runtime — do not bundle it
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
}

// Include plugin.yml from resources directory
processResources {
    from('src/main/resources') {
        include 'plugin.yml'
        // Optionally inject version from build file into plugin.yml
        expand(version: version)
    }
}

jar {
    archiveFileName = "${project.name}-${version}.jar"
    destinationDirectory = file("$projectDir/build/libs")
}
